name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cache node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Astro build
        uses: actions/cache@v4
        with:
          path: .astro
          key: ${{ runner.os }}-astro-${{ hashFiles('src/**', 'public/**', 'astro.config.mjs') }}
          restore-keys: ${{ runner.os }}-astro-

      - name: Cache TinaCMS
        uses: actions/cache@v4
        with:
          path: tina/__generated__
          key: ${{ runner.os }}-tina-${{ hashFiles('tina/config.ts') }}
          restore-keys: ${{ runner.os }}-tina-

      - name: Build
        env:
          TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          GITHUB_BRANCH: main
          TZ: America/New_York
        run: |
          for attempt in 1 2 3; do
            npm run build && break
            if [ $attempt -lt 3 ]; then
              echo "Build attempt $attempt failed, waiting 30s for Tina Cloud to index..."
              sleep 30
            else
              echo "Build failed after 3 attempts"
              exit 1
            fi
          done

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
